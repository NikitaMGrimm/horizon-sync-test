# SCRATCH ONLY: stands in for the real publish, to leave a verified-files artifact.
name: publish
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          mkdir files
          python3 - <<'PY' > list.txt
          import tomllib, glob
          for p in glob.glob("mods/*.toml"):
              e = tomllib.load(open(p, "rb"))
              for v in e.get("versions", []):
                  print(v["sha256"], e["id"], v["version"], v["file"])
          PY
          while read -r sha id version file; do
            curl -fsSL "https://github.com/horizon-rust/horizon-mods/releases/download/$id-$version/$file" -o "files/$sha"
            echo "$sha  files/$sha" | sha256sum --check
          done < list.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-files
          path: files/
          retention-days: 1
